## =============================================================================
## 测试专用配置：H2 内存库，mvn test 不依赖本机 MySQL，也不连真实 Nacos
## =============================================================================
spring:
  # 测试里关闭 Nacos 注册与发现：单元测试不应该依赖外部中间件
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false

  datasource:
    url: jdbc:h2:mem:foodsvc;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  sql:
    init:
      mode: always
      encoding: UTF-8
