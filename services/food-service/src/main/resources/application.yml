## =============================================================================
## food-service 配置
##
## 服务边界：只连 health_diet_food 一个库，账号 svc_food 只被授权访问它。
## 用户与饮食记录的数据在本服务里完全不可见。
## =============================================================================
server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: food-service

  # ---------------------------------------------------------------------------
  # 第 07 周：注册到 Nacos（服务名 = spring.application.name = food-service）
  # 地址、凭据、命名空间、分组全部可用环境变量覆盖，仓库里不写真实密钥。
  # ---------------------------------------------------------------------------
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
        enabled: ${NACOS_DISCOVERY_ENABLED:true}

      # ---------------------------------------------------------------------------
      # 第 10 周：配置中心。日志级别等非敏感参数集中到 Nacos；
      # 数据库口令仍由 .env 注入，不进配置中心。
      # ---------------------------------------------------------------------------
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
        import-check:
          enabled: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/health_diet_food?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:svc_food}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      encoding: UTF-8

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.zjgsu.hdt.food: INFO

# 第 10 周：环境标识与配置来源（Nacos 里的值会覆盖 local 默认值）
app:
  environment: ${APP_ENV:dev}
  config:
    source: local

---
# -----------------------------------------------------------------------------
# 第 10 周：Nacos Config 导入
#   dev → food-service-dev.yaml ；test → food-service-test.yaml（APP_ENV=test）
# -----------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: "!test"
    import: "optional:nacos:${spring.application.name}-${APP_ENV:dev}.yaml?group=${NACOS_GROUP:PERSONAL_GROUP}&refreshEnabled=true"
