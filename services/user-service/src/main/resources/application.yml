## =============================================================================
## user-service 配置
##
## 服务边界：本服务只连 health_diet_user 一个库，账号 svc_user 也只被授权访问它。
## 其他服务的数据（食物、饮食记录）在本服务里完全不可见，只能通过 HTTP 访问。
## =============================================================================
server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service
  # ---------------------------------------------------------------------------
  # 第 07 周：注册到 Nacos
  #
  # 服务名用 spring.application.name（= user-service），Nacos 控制台里看到的就是它。
  # 地址与凭据一律走环境变量：仓库里不写真实密钥，compose 里从 .env 注入。
  # 分组 PERSONAL_GROUP 是本项目专用的，不与课堂示例混用。
  # ---------------------------------------------------------------------------
  cloud:
    nacos:
      discovery:
        # 服务端地址：8848 是 Nacos 服务端端口，SDK 通信走 9848
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        # 留空表示使用默认命名空间 public；自定义命名空间请填【命名空间 ID】
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
        # 测试时置 false，避免单元测试去连真实 Nacos
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
        enabled: ${NACOS_DISCOVERY_ENABLED:true}

      # ---------------------------------------------------------------------------
      # 第 10 周：配置中心。只集中管理非敏感配置（如 JWT 有效期、日志级别）；
      # JWT_SECRET / DB_PASSWORD 等仍从 .env 注入，绝不写进 Nacos 配置。
      # 导入语句见文件末尾的 "!test" 文档。
      # ---------------------------------------------------------------------------
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
        import-check:
          enabled: true

  datasource:
    # 数据库地址、账号、口令全部可被环境变量覆盖：
    #   本地调试用默认值；compose 里覆盖成 mysql:3306 / svc_user / .env 中的口令
    url: ${DB_URL:jdbc:mysql://localhost:3306/health_diet_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:svc_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      # 表结构由 schema.sql 管理，不让 Hibernate 自动建表，避免两套 DDL 打架
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      # 每次启动都执行，脚本用 CREATE TABLE IF NOT EXISTS / INSERT IGNORE 保证幂等
      mode: always
      encoding: UTF-8

  jackson:
    default-property-inclusion: non_null

# =============================================================================
# 第 09 周：认证与授权配置
#
# JWT_SECRET 必须与 gateway-service 完全一致：本服务签发，网关验签，用的是一把
# HS256 对称密钥。compose.yaml 从 .env 注入；这里的默认值只是本地开发的占位符，
# 【不是真实密钥】，生产环境必须覆盖。
#
# GATEWAY_SECRET 是网关与下游之间的内部口令：网关转发时写入请求头
# X-Gateway-Secret，管理接口校验它，用来拒绝绕过网关的直连请求。
# =============================================================================
app:
  # 第 10 周：环境标识与配置来源。Nacos 配置里的 app.config.source=nacos
  # 会覆盖这里的 local 默认值，作为"配置确实来自 Nacos"的可观察证据。
  environment: ${APP_ENV:dev}
  config:
    source: local
  jwt:
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-32bytes}
    issuer: user-service
    # 非敏感业务参数，可被 Nacos 的 user-service-{dev|test}.yaml 覆盖
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  gateway:
    secret: ${GATEWAY_SECRET:local-dev-only-gateway-secret-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.zjgsu.hdt.user: INFO

---
# -----------------------------------------------------------------------------
# 第 10 周：Nacos Config 导入
#   dev → user-service-dev.yaml ；test → user-service-test.yaml（APP_ENV=test）
#   optional: 让 Nacos 暂时不可达时仍能启动；!test 让单元测试无需外部依赖。
# -----------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: "!test"
    import: "optional:nacos:${spring.application.name}-${APP_ENV:dev}.yaml?group=${NACOS_GROUP:PERSONAL_GROUP}&refreshEnabled=true"
