## =============================================================================
## user-service 配置
##
## 服务边界：本服务只连 health_diet_user 一个库，账号 svc_user 也只被授权访问它。
## 其他服务的数据（食物、饮食记录）在本服务里完全不可见，只能通过 HTTP 访问。
## =============================================================================
server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service

  # ---------------------------------------------------------------------------
  # 第 07 周：注册到 Nacos
  #
  # 服务名用 spring.application.name（= user-service），Nacos 控制台里看到的就是它。
  # 地址与凭据一律走环境变量：仓库里不写真实密钥，compose 里从 .env 注入。
  # 分组 PERSONAL_GROUP 是本项目专用的，不与课堂示例混用。
  # ---------------------------------------------------------------------------
  cloud:
    nacos:
      discovery:
        # 服务端地址：8848 是 Nacos 服务端端口，SDK 通信走 9848
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        # 留空表示使用默认命名空间 public；自定义命名空间请填【命名空间 ID】
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
        # 测试时置 false，避免单元测试去连真实 Nacos
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
        enabled: ${NACOS_DISCOVERY_ENABLED:true}

  datasource:
    # 数据库地址、账号、口令全部可被环境变量覆盖：
    #   本地调试用默认值；compose 里覆盖成 mysql:3306 / svc_user / .env 中的口令
    url: ${DB_URL:jdbc:mysql://localhost:3306/health_diet_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:svc_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      # 表结构由 schema.sql 管理，不让 Hibernate 自动建表，避免两套 DDL 打架
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      # 每次启动都执行，脚本用 CREATE TABLE IF NOT EXISTS / INSERT IGNORE 保证幂等
      mode: always
      encoding: UTF-8

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.zjgsu.hdt.user: INFO
