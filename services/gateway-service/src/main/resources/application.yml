## =============================================================================
## gateway-service 配置（第 09 周）
##
## 统一对外入口：宿主机 8080。客户端只认识这一个地址，
## 由网关根据路径把请求转发给 Nacos 里注册的服务（lb://服务名）。
## =============================================================================
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service

  cloud:
    # -------------------------------------------------------------------------
    # 服务发现：网关自己也要注册到 Nacos（便于在控制台看到它），
    # 更重要的是用同一分组去订阅 user-service / food-service / meal-service。
    # -------------------------------------------------------------------------
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
        enabled: ${NACOS_DISCOVERY_ENABLED:true}

      # ---------------------------------------------------------------------------
      # 第 10 周：配置中心。网关也从 Nacos 读取同一分组下的非敏感配置；
      # 认证密钥仍只从 .env 注入，绝不写入配置中心。
      # ---------------------------------------------------------------------------
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
        import-check:
          enabled: true

    # -------------------------------------------------------------------------
    # 路由表：至少三条，目标一律写【服务名】而不是 IP。
    #
    # 顺序说明：Admin 路由必须放在 User 路由之前吗？
    #   不需要 —— 路径前缀互不重叠（/api/admin 与 /api/users），
    #   但保留独立路由是为了让"管理接口"在配置里一眼可见。
    #
    # 注意 Spring Cloud Gateway 5.0 的属性前缀是
    #   spring.cloud.gateway.server.webflux.*
    # （旧版的 spring.cloud.gateway.* 是 4.x 及更早的写法）
    # -------------------------------------------------------------------------
    gateway:
      server:
        webflux:
          routes:
            # 登录：白名单接口，网关过滤器放行后转发到用户服务
            - id: auth-route
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**

            # 用户资料（meal-service 内部直连，不经网关）
            - id: user-route
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

            # 管理接口：网关的 JwtAuthenticationFilter 要求 role=ADMIN
            - id: admin-route
              uri: lb://user-service
              predicates:
                - Path=/api/admin/**

            # 食物库
            - id: food-route
              uri: lb://food-service
              predicates:
                - Path=/api/foods/**

            # 饮食记录
            - id: meal-route
              uri: lb://meal-service
              predicates:
                - Path=/api/meals/**

# =============================================================================
# 认证配置：必须与 user-service 的 JWT_SECRET / GATEWAY_SECRET 完全一致。
# 默认值只是本地开发占位符，compose 会从 .env 覆盖。
# =============================================================================
app:
  environment: ${APP_ENV:dev}
  config:
    source: local
  jwt:
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-32bytes}
  gateway:
    secret: ${GATEWAY_SECRET:local-dev-only-gateway-secret-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.zjgsu.hdt.gateway: INFO
    org.springframework.cloud.gateway: INFO

---
# -----------------------------------------------------------------------------
# 第 10 周：Nacos Config 导入
#   dev → gateway-service-dev.yaml ；test → gateway-service-test.yaml（APP_ENV=test）
# -----------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: "!test"
    import: "optional:nacos:${spring.application.name}-${APP_ENV:dev}.yaml?group=${NACOS_GROUP:PERSONAL_GROUP}&refreshEnabled=true"
